services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tallernet}
      POSTGRES_USER: ${POSTGRES_USER:-tallernet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tallernet_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1.3-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-tallernet_worker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tallernet_dev}
      RABBITMQ_ERLANG_COOKIE: tallernet_dev_cookie
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  backoffice:
    build:
      context: .
      dockerfile: src/Plataforma.Backoffice/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tallernet};Username=${POSTGRES_USER:-tallernet_admin};Password=${POSTGRES_PASSWORD:-tallernet_dev}
      Redis__Configuration: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USERNAME:-tallernet_worker}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-tallernet_dev}
      # Secreto del receptor de prueba (/api/receptor-prueba/avisos); en producción viene del secreto de Kubernetes.
      Avisos__ClaveFirma: ${AVISOS_CLAVE_FIRMA:-clave-demo-avisos-2026}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: src/Plataforma.PortalComercio/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tallernet};Username=${POSTGRES_USER:-tallernet_admin};Password=${POSTGRES_PASSWORD:-tallernet_dev}
      Redis__Configuration: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USERNAME:-tallernet_worker}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-tallernet_dev}
      Avisos__HostsHttpPermitidos__0: backoffice
    ports:
      - "8081:8080"
    volumes:
      - portal-keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Plataforma.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tallernet};Username=${POSTGRES_USER:-tallernet_admin};Password=${POSTGRES_PASSWORD:-tallernet_dev}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USERNAME:-tallernet_worker}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-tallernet_dev}
      # El receptor de prueba (dentro del Backoffice) corre sin TLS en la red de compose.
      # URL a cargar en el Portal: http://backoffice:8080/api/receptor-prueba/avisos
      Avisos__HostsHttpPermitidos__0: backoffice
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  portal-keys:
  rabbitmq-data: