name: CI and ECR delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_PUBLISH_ENABLED: ${{ secrets.AWS_PUBLISH_ENABLED }}
  WORKER_DEPLOY_ENABLED: ${{ secrets.WORKER_DEPLOY_ENABLED }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    # PostgreSQL efímero solo para la prueba de integración (6.15); no es la base del ambiente.
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_PASSWORD: pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Plataforma.sln

      # SCA (análisis de dependencias): lista los paquetes NuGet con vulnerabilidades conocidas, directos y transitivos.
      # Informa y no corta el pipeline: la decisión sobre cada hallazgo se documenta (hay alguno sin arreglo en .NET 10).
      - name: Dependency vulnerability scan (SCA)
        run: |
          dotnet list Plataforma.sln package --vulnerable --include-transitive | tee sca.txt
          {
            echo "## SCA: paquetes NuGet vulnerables"
            echo '```'
            grep -E "tiene los paquetes vulnerables|has the following vulnerable|^\s*>" sca.txt || echo "Sin paquetes vulnerables."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: dotnet build Plataforma.sln --configuration Release --no-restore

      - name: Run domain tests
        run: dotnet test tests/Plataforma.Domain.Tests/Plataforma.Domain.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run tenant-isolation tests
        run: dotnet test tests/Plataforma.Infrastructure.Tests/Plataforma.Infrastructure.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run integration tests (PostgreSQL)
        env:
          PRUEBAS_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=pruebas
        run: dotnet test tests/Plataforma.Infrastructure.Tests/Plataforma.Infrastructure.Tests.csproj --configuration Release --no-build --no-restore --filter "Category=Integracion"

      - name: Run architecture tests
        run: dotnet test tests/Plataforma.Architecture.Tests/Plataforma.Architecture.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run notification tests
        run: dotnet test tests/Plataforma.Avisos.Tests/Plataforma.Avisos.Tests.csproj --configuration Release --no-build --no-restore

  publish-images:
    name: Build and publish images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        if: env.AWS_PUBLISH_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.AWS_PUBLISH_ENABLED == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Backoffice
        if: env.AWS_PUBLISH_ENABLED == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name tallernet/backend --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "La imagen tallernet/backend:$IMAGE_TAG ya existe; se reutilizara."
            exit 0
          fi
          docker build --file src/Plataforma.Backoffice/Dockerfile --tag tallernet-backoffice:$IMAGE_TAG .
          docker tag tallernet-backoffice:$IMAGE_TAG $ECR_REGISTRY/tallernet/backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/tallernet/backend:$IMAGE_TAG

      - name: Build, tag and push Portal
        if: env.AWS_PUBLISH_ENABLED == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name tallernet/frontend --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "La imagen tallernet/frontend:$IMAGE_TAG ya existe; se reutilizara."
            exit 0
          fi
          docker build --file src/Plataforma.PortalComercio/Dockerfile --tag tallernet-portal:$IMAGE_TAG .
          docker tag tallernet-portal:$IMAGE_TAG $ECR_REGISTRY/tallernet/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/tallernet/frontend:$IMAGE_TAG

      - name: Build, tag and push Worker
        if: env.AWS_PUBLISH_ENABLED == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name tallernet/worker --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "La imagen tallernet/worker:$IMAGE_TAG ya existe; se reutilizara."
            exit 0
          fi
          docker build --file src/Plataforma.Worker/Dockerfile --tag tallernet-worker:$IMAGE_TAG .
          docker tag tallernet-worker:$IMAGE_TAG $ECR_REGISTRY/tallernet/worker:$IMAGE_TAG
          docker push $ECR_REGISTRY/tallernet/worker:$IMAGE_TAG

      # Escaneo de las imágenes publicadas (sistema operativo y librerías) con Trivy, versión fija. Usa el login de ECR
      # del paso anterior. Informa las vulnerabilidades altas y críticas sin cortar el despliegue.
      - name: Scan images (Trivy)
        if: env.AWS_PUBLISH_ENABLED == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "## Trivy: vulnerabilidades HIGH y CRITICAL de las imágenes" >> "$GITHUB_STEP_SUMMARY"
          for repositorio in backend frontend worker; do
            imagen="$ECR_REGISTRY/tallernet/$repositorio:$IMAGE_TAG"
            docker run --rm -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" aquasec/trivy:0.58.1 \
              image --scanners vuln --severity HIGH,CRITICAL --no-progress --exit-code 0 "$imagen" | tee "trivy-$repositorio.txt"
            {
              echo "### tallernet/$repositorio"
              echo '```'
              grep -E "^Total:|\((debian|ubuntu|alpine|dotnet-core)" "trivy-$repositorio.txt" || echo "Sin resultados."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Configure kubectl
        if: env.AWS_PUBLISH_ENABLED == 'true'
        uses: azure/setup-kubectl@v4

      - name: Deploy applications to EKS
        if: env.AWS_PUBLISH_ENABLED == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
          # Opcionales: viven en los secrets del repositorio (no en AWS), así sobreviven a un ambiente nuevo.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          SMTP_REMITENTE: ${{ secrets.SMTP_REMITENTE }}
        run: |
          aws eks update-kubeconfig --name tallernet-cluster --region "$AWS_REGION"
          kubectl -n tallernet get secret tallernet-application-secrets
          if [ -z "$MONGODB_CONNECTION_STRING" ]; then
            echo "Falta el secret MONGODB_CONNECTION_STRING."
            exit 1
          fi
          mongo_connection_string_base64="$(printf %s "$MONGODB_CONNECTION_STRING" | base64 --wrap=0)"
          kubectl -n tallernet patch secret tallernet-application-secrets --type merge \
            --patch "{\"data\":{\"Mongo__ConnectionString\":\"$mongo_connection_string_base64\"}}"
          # Push (Firebase) y correo (SMTP): se cargan solo si el secret del repositorio existe; si no, quedan como estén.
          cargar_opcional() {
            if [ -n "$2" ]; then
              valor="$(printf %s "$2" | base64 --wrap=0)"
              kubectl -n tallernet patch secret tallernet-application-secrets --type merge \
                --patch "{\"data\":{\"$1\":\"$valor\"}}" > /dev/null
              echo "Clave $1 cargada en el secret de la aplicación."
            fi
          }
          cargar_opcional Push__Fcm__CuentaServicioJson "$FIREBASE_SERVICE_ACCOUNT_JSON"
          cargar_opcional Notificaciones__SmtpHost "$SMTP_HOST"
          cargar_opcional Notificaciones__SmtpUsuario "$SMTP_USUARIO"
          cargar_opcional Notificaciones__SmtpClave "$SMTP_CLAVE"
          cargar_opcional Notificaciones__Remitente "$SMTP_REMITENTE"
          kubectl -n tallernet delete job database-migration --ignore-not-found
          sed "s|tallernet/backend:bootstrap|$ECR_REGISTRY/tallernet/backend:$IMAGE_TAG|g" infra/terraform/k8s/base/migration.yaml | kubectl apply -f -
          kubectl -n tallernet wait --for=condition=complete job/database-migration --timeout=5m
          # Replicas pasó al HPA: se saca del último manifiesto aplicado, si no, aplicar sin ese campo bajaría a 1 réplica.
          if kubectl -n tallernet apply view-last-applied deployment/backoffice -o json > /tmp/backoffice.json 2>/dev/null; then
            jq 'del(.spec.replicas)' /tmp/backoffice.json > /tmp/backoffice-sin-replicas.json
            kubectl apply set-last-applied -f /tmp/backoffice-sin-replicas.json
          fi
          kubectl kustomize infra/terraform/k8s/base \
            | sed -e "s|tallernet/backend:bootstrap|$ECR_REGISTRY/tallernet/backend:$IMAGE_TAG|g" \
                  -e "s|tallernet/frontend:bootstrap|$ECR_REGISTRY/tallernet/frontend:$IMAGE_TAG|g" \
            | kubectl apply -f -
          rollout() {
            local deployment="$1"
            if ! kubectl -n tallernet rollout status "deployment/$deployment" --timeout=7m; then
              kubectl -n tallernet get pods -o wide
              kubectl -n tallernet describe "deployment/$deployment"
              kubectl -n tallernet get events --sort-by=.metadata.creationTimestamp
              kubectl -n tallernet logs "deployment/$deployment" --all-containers=true --tail=200 || true
              exit 1
            fi
          }
          rollout backoffice
          rollout portal
          if [ "$WORKER_DEPLOY_ENABLED" = "true" ]; then
            # El worker necesita ConnectionStrings__Default del secreto de la aplicación (igual que el backoffice).
            # Idempotente: es lo mismo que el env_from de platform.tf, para que funcione aunque no se haya aplicado.
            kubectl -n tallernet patch deployment queue-worker --type strategic -p \
              '{"spec":{"template":{"spec":{"containers":[{"name":"queue-worker","envFrom":[{"secretRef":{"name":"tallernet-application-secrets"}}]}]}}}}'
            kubectl -n tallernet set image deployment/queue-worker queue-worker=$ECR_REGISTRY/tallernet/worker:$IMAGE_TAG
            kubectl -n tallernet scale deployment/queue-worker --replicas=1
            rollout queue-worker
          else
            kubectl -n tallernet scale deployment/queue-worker --replicas=0
            echo "Worker publicado en ECR, pero mantenido en cero replicas hasta habilitar WORKER_DEPLOY_ENABLED."
          fi
          # Métricas de CPU que necesita el HPA.
          kubectl apply -f infra/terraform/k8s/metrics-server/components.yaml
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=3m