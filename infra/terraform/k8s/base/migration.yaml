apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  labels:
    app.kubernetes.io/name: database-migration
    app.kubernetes.io/part-of: tallernet
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: database-migration
          image: tallernet/backend:bootstrap
          envFrom:
            - secretRef:
                name: tallernet-application-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Database__MigrateOnStartup
              value: "true"
            - name: Database__MigrateOnly
              value: "true"