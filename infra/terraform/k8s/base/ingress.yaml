apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tallernet
  namespace: tallernet
spec:
  ingressClassName: nginx
  rules:
    - host: api.tallernet.cloud-ip.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  name: http
    - host: app.tallernet.cloud-ip.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
    - host: backoffice.tallernet.cloud-ip.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  name: http