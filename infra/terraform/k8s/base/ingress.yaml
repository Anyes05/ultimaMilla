apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tallernet
  namespace: tallernet
spec:
  ingressClassName: nginx
  rules:
    - host: api.tallernet.cloud-ip.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  name: http
    - host: app.tallernet.cloud-ip.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
    - host: backoffice.tallernet.cloud-ip.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  name: http
    # Seguimiento público en Blazor (Portal), validado en AWS el 03/11. Vuelta atrás hasta después del 12/11:
    # volver a "backoffice" acá; su página /Seguimiento sigue disponible.
    - host: tracking.tallernet.cloud-ip.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http