apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tallernet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: example.invalid/tallernet/backend:replace-with-immutable-tag
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: tallernet-application-secrets
          env:
            - name: Redis__Host
              value: tallernet-redis.tallernet.svc.cluster.local
            - name: Redis__Port
              value: "6379"
            - name: Redis__Password
              valueFrom:
                secretKeyRef:
                  name: tallernet-redis-credentials
                  key: redis-password
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /live
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http