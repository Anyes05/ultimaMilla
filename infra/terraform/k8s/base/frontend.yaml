apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/part-of: tallernet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backoffice
          image: example.invalid/tallernet/backoffice:replace-with-immutable-tag
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice
spec:
  selector:
    app.kubernetes.io/name: backoffice
  ports:
    - name: http
      port: 80
      targetPort: http
---
