apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/part-of: tallernet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backoffice
          image: tallernet/backend:bootstrap
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: tallernet-application-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Database__MigrateOnStartup
              value: "false"
            - name: Redis__Host
              value: tallernet-redis.tallernet.svc.cluster.local
            - name: Redis__Port
              value: "6379"
            - name: Redis__Password
              valueFrom:
                secretKeyRef:
                  name: tallernet-redis-credentials
                  key: redis-password
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /live
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice
spec:
  selector:
    app.kubernetes.io/name: backoffice
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/part-of: tallernet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      automountServiceAccountToken: false
      containers:
        - name: portal
          image: tallernet/frontend:bootstrap
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: tallernet-application-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Redis__Host
              value: tallernet-redis.tallernet.svc.cluster.local
            - name: Redis__Port
              value: "6379"
            - name: Redis__Password
              valueFrom:
                secretKeyRef:
                  name: tallernet-redis-credentials
                  key: redis-password
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /live
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 80
      targetPort: http