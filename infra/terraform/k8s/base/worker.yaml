apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tallernet
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: example.invalid/tallernet/worker:replace-with-immutable-tag
          envFrom:
            - secretRef:
                name: tallernet-application-secrets
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "find /tmp/worker-listo -mmin -1 | grep -q ."]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "find /tmp/worker-vivo -mmin -1 | grep -q ."]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi